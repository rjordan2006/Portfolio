<!-- CONTACT -->
<section id="contact">
  <div class="section-inner">
    <div class="section-label">Get in Touch</div>
    <h2>Let's Connect</h2>
    <p class="section-intro" style="margin:0.5rem auto 0; text-align:center;">Open to executive advisory engagements, board conversations, and connecting with fellow product leaders.</p>

    <div class="contact-links">
      <a class="btn btn-primary" href="https://www.linkedin.com/in/rachel-jordan" target="_blank">LinkedIn</a>
    </div>

    <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <input type="hidden" name="_replyto" value="">

      <div class="form-group">
        <label class="form-label" for="contact-name">Name</label>
        <input class="form-input" type="text" id="contact-name" name="name" placeholder="Your name" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="contact-email">Email</label>
        <input class="form-input" type="email" id="contact-email" name="email" placeholder="your@email.com" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="contact-message">Message</label>
        <textarea class="form-input form-textarea" id="contact-message" name="message" placeholder="What would you like to discuss?" rows="5" required></textarea>
      </div>

      <button class="btn btn-primary form-submit" type="submit">Send Message</button>
    </form>
  </div>
</section>
